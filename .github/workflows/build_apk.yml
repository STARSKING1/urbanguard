name: Build & Publish UrbanGuard Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Set up Java JDK (Android Environment)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Rename & Stage APKs
        run: |
          mkdir -p output_apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_apks/UrbanGuard-v1.0.0-arm64.apk 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-release.apk output_apks/UrbanGuard-v1.0.0-universal.apk 2>/dev/null || true

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UrbanGuard-Android-APK
          path: output_apks/*.apk

      - name: Publish GitHub Release (On Release Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output_apks/*.apk
          tag_name: ${{ github.ref_name }}
          title: "UrbanGuard Release ${{ github.ref_name }}"
          body: "Official release build of the UrbanGuard Resilience Engine Android App."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
